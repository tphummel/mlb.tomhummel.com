<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ block "title" . }}{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}{{ end }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 16 16'
><text x='0' y='14'>⚾️</text></svg>" />
    <meta id="description" name="description" content="{{ block "description" . }}{{ if .Description }}{{ .Description }}{{ else
 }}{{ .Site.Params.site_description }}{{ end }}{{ end }}"/>

    {{ if eq (getenv "HUGO_ENV") "production" }}
      <META NAME="ROBOTS" CONTENT="INDEX, FOLLOW">
    {{ else }}
      <META NAME="ROBOTS" CONTENT="NOINDEX, NOFOLLOW">
    {{ end }}

    <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/water.css@2/out/dark.min.css"> -->
    <!-- <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/water.css@2/out/light.min.css"> -->
    <!-- <link rel="stylesheet" href="https://unpkg.com/mvp.css"> -->
    <!-- style sheet: fleer-1991 (junk.tomhummel.com/styles/fleer-1991/) -->
    <link rel="stylesheet" href="https://junk.tomhummel.com/styles/fleer-1991/fleer-1991.css">
    <style>
      /* glue for plain Hugo/markdown output, built from fleer-1991 tokens */
      .fl-page { max-width: min(110ch, 100%); margin: 0 auto; padding: clamp(1rem, 4vw, 2rem); }
      .fl-page :is(h1, h2, h3) { margin-top: 1.5em; }
      .fl-page > :is(h1, h2):first-child { margin-top: 0; }
      .fl-page blockquote { margin: 1.5rem 0; padding: 0.75rem 1.25rem; border-left: 0.4rem solid var(--fl-yellow); background: var(--fl-surface); border-radius: var(--fl-radius); }
      .fl-page table { border-collapse: collapse; width: 100%; margin: 1rem 0; background: var(--fl-surface); }
      .fl-page th, .fl-page td { padding: 0.45rem 0.7rem; text-align: left; border: 1px solid var(--fl-line); }
      .fl-page th { background: var(--fl-blue); color: var(--fl-on-blue); font-size: 0.8rem; text-transform: uppercase; letter-spacing: var(--fl-track-label); }
      .fl-page pre { overflow-x: auto; padding: 1rem; background: var(--fl-surface); border: 1px solid var(--fl-line); border-radius: var(--fl-radius); }

      .breadcrumb { display: flex; flex-wrap: wrap; gap: 0.35em; font-size: 0.95em; }
      .breadcrumb span { display: flex; gap: 0.35em; align-items: baseline; white-space: nowrap; }

      .meta-line { display: flex; flex-wrap: wrap; gap: 0.4em; align-items: baseline; margin-bottom: 1rem; font-size: 0.95em; }
      .meta-line .meta-label { font-weight: 700; text-transform: uppercase; font-size: 0.8em; letter-spacing: var(--fl-track-label); color: var(--fl-fg-muted); }
      .meta-line .meta-label::after { content: ":"; margin-left: 0.35em; }
      .meta-line .meta-value { display: flex; flex-wrap: wrap; gap: 0.4em; }
      .meta-line .meta-value span::before { content: ","; margin-right: 0.3em; }
      .meta-line .meta-value span:first-child::before { content: ""; margin-right: 0; }
    </style>
  </head>

  <body class="fl">
    <div class="fl-page">
    {{ block "main" . }}
    {{ end }}
    </div>
  </body>
</html>
